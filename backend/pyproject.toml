[project]
name = "ai-incubator-backend"
version = "0.1.0"
description = "AI Incubator Backend API"
authors = [
    {name = "Your Name"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.1.0.post1",
    "openai>=1.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.8.0",
    "pylint>=3.3.0",
    "mypy>=1.11.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pylint.messages_control]
disable = "C0111,C0103"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
